<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clarify â€” Ask your data</title>
<style>
:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --text: #1d1d1f;
  --text-2: #6e6e73;
  --text-3: #aeaeb2;
  --border: #e5e5ea;
  --border-light: #f2f2f7;
  --accent: #0071e3;
  --accent-hover: #0077ed;
  --accent-soft: #eaf4fe;
  --red: #ff3b30;
  --green: #34c759;
  --code-bg: #1d1d1f;
  --code-fg: #e5e5ea;
  --r: 12px;
  --r-sm: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.05);
  --font: -apple-system,BlinkMacSystemFont,"SF Pro Display","SF ProText",Inter,system-ui,sans-serif;
  --mono: "SF Mono",SFMono-Regular,ui-monospace,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;min-height:100dvh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}

/*  header  */
.hdr{position:sticky;top:0;z-index:90;background:rgba(250,250,250,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);height:52px;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.brand i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block}
.hdr-r{display:flex;align-items:center;gap:18px}
.conn{font-size:11px;color:var(--text-3);display:flex;align-items:center;gap:4px}
.conn b{width:5px;height:5px;border-radius:50%;background:var(--green);display:block}
.conn b.off{background:var(--red)}
.tgl-wrap{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2);user-select:none}
.tgl{position:relative;width:38px;height:22px;border-radius:11px;background:#ccc;transition:background .2s;cursor:pointer;flex-shrink:0}
.tgl.on{background:var(--accent)}
.tgl::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2pxrgba(0,0,0,.15);transition:transform .2s}
.tgl.on::after{transform:translateX(16px)}

/* layout */
.wrap{flex:1;max-width:700px;width:100%;margin:0 auto;padding:0 24px;display:flex;flex-direction:column}

/* â”€â”€â”€ landing â”€â”€â”€ */
.landing{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:90px;text-align:center}
.landing h1{font-size:34px;font-weight:700;letter-spacing:-.03em;margin-bottom:6px}
.landing p{font-size:16px;color:var(--text-2);margin-bottom:36px;max-width:360px}
.examples{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:500px}
.ex{font-size:13px;color:var(--text-2);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 15px;transition:all .18s;cursor:pointer;white-space:nowrap}
.ex:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* â”€â”€â”€ conversation â”€â”€â”€ */
.conv{flex:1;padding:28px 0 130px;display:none}
.conv.on{display:block}

.blk{margin-bottom:28px;animation:up .28s ease both}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.blk{animation:none}}

.q-text{font-size:19px;font-weight:600;letter-spacing:-.015em;padding-left:12px;border-left:3px solid var(--accent);margin-bottom:18px}

/* â”€â”€â”€ thinking â”€â”€â”€ */
.think{display:flex;align-items:center;gap:7px;color:var(--text-3);font-size:14px;padding:10px 0}
.dots{display:flex;gap:4px}
.dots span{width:4px;height:4px;border-radius:50%;background:var(--text-3);animation:pop 1.1s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.12s}
.dots span:nth-child(3){animation-delay:.24s}
@keyframes pop{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

/* â”€â”€â”€ clarification â”€â”€â”€ */
.clar{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px}
.clar-pre{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:6px}
.clar-q{font-size:15px;color:var(--text);margin-bottom:14px;line-height:1.55}
.clar-row{display:flex;gap:8px}
.clar-in{flex:1;border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 13px;font-size:14px;color:var(--text);background:var(--bg);outline:none;transition:border-color .18s}
.clar-in:focus{border-color:var(--accent)}
.clar-btn{background:var(--accent);color:#fff;font-size:14px;font-weight:500;padding:9px 18px;border-radius:var(--r-sm);transition:background .18s}
.clar-btn:hover{background:var(--accent-hover)}
.clar-btn:disabled{opacity:.45;cursor:not-allowed}

/* â”€â”€â”€ assumption â”€â”€â”€ */
.assume{font-size:13px;color:var(--text-2);background:var(--accent-soft);border-radius:var(--r-sm);padding:9px 13px;margin-bottom:14px;display:flex;gap:5px;align-items:baseline}
.assume strong{color:var(--accent);flex-shrink:0}

/* â”€â”€â”€ results table â”€â”€â”€ */
.res-lbl{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.t-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
.t-wrap table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}
.t-wrap th{text-align:left;font-weight:600;font-size:11px;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;padding:9px15px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0}
.t-wrap td{padding:9px 15px;border-bottom:1px solid var(--border-light)}
.t-wrap tr:last-child td{border-bottom:none}
.t-wrap tr:hover td{background:var(--bg)}

/* â”€â”€â”€ SQL expander â”€â”€â”€ */
.sql-sec{margin-top:14px}
.sql-tog{font-size:13px;color:var(--text-3);display:flex;align-items:center;gap:5px;padding:3px 0;transition:color .18s}
.sql-tog:hover{color:var(--text-2)}
.sql-arr{display:inline-block;font-size:9px;transition:transform .18s}
.sql-arr.open{transform:rotate(90deg)}
.sql-body{display:none;margin-top:8px;position:relative}
.sql-body.on{display:block}
.sql-pre{background:var(--code-bg);color:var(--code-fg);font-family:var(--mono);font-size:13px;line-height:1.55;padding:15px 18px;border-radius:var(--r);overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.sql-cp{position:absolute;top:7px;right:7px;font-size:11px;color:var(--text-3);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:5px;padding:3px 9px;transition:all .18s}
.sql-cp:hover{background:rgba(255,255,255,.18);color:#fff}
.sql-cp.ok{color:var(--green)}

/* â”€â”€â”€ error â”€â”€â”€ */
.err{background:#fff5f5;border:1px solid #fecaca;border-radius:var(--r);padding:14px 18px;font-size:14px;color:#991b1b}
.err strong{display:block;margin-bottom:3px;color:var(--red)}

/* â”€â”€â”€ input bar â”€â”€â”€ */
.bar{position:fixed;bottom:0;left:0;right:0;background:rgba(250,250,250,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:11px 24px;z-index:90}
.bar-in{max-width:700px;margin:0 auto;display:flex;gap:8px}
.q-input{flex:1;border:1px solid var(--border);border-radius:22px;padding:11px 18px;font-size:15px;color:var(--text);background:var(--surface);outline:none;transition:border-color .18s,box-shadow .18s}
.q-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.1)}
.q-input::placeholder{color:var(--text-3)}
.q-send{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;transition:background .18s,transform .08s;flex-shrink:0}
.q-send:hover{background:var(--accent-hover)}
.q-send:active{transform:scale(.94)}
.q-send:disabled{opacity:.35;cursor:not-allowed;transform:none}
.q-send svg{width:17px;height:17px}

@media(max-width:600px){
  .hdr{padding:0 14px}
  .wrap{padding:0 14px}
  .bar{padding:9px 14px}
  .landing h1{font-size:26px}
  .landing p{font-size:14px}
  .examples{gap:6px}
  .ex{font-size:12px;padding:5px 11px}
  .q-text{font-size:16px}
  .clar{padding:14px}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="brand"><i></i> Clarify</div>
  <div class="hdr-r">
    <div class="conn"><b id="cD"></b><span id="cT">Connecting</span></div>
    <div class="tgl-wrap">
      <span>Clarification</span>
      <div class="tgl on" id="tgl" role="switch" aria-checked="true" tabindex="0" aria-label="Clarification mode"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="landing" id="land">
    <h1>Ask your data.</h1>
    <p>Natural language questions, real answers from your database.</p>
    <div class="examples" id="exs">
      <button class="ex">How many customers are from Brazil?</button>
      <button class="ex">Who are the top customers?</button>
      <button class="ex">Which artists sell the most tracks?</button>
      <button class="ex">Which genres generate the most revenue?</button>
    </div>
  </section>
  <section class="conv" id="conv"></section>
</main>

<div class="bar">
  <div class="bar-in">
    <input class="q-input" id="qIn" type="text" placeholder="Ask something about your data " autocomplete="off" aria-label="Query">
    <button class="q-send" id="qSend" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<script>
(function(){
  const API = location.origin;
  let clarOn = true, busy = false, pending = null;

  const $ = id => document.getElementById(id);
  const land = $('land'), conv = $('conv'), qIn = $('qIn'), qSend =$('qSend');
  const tgl = $('tgl'), cD = $('cD'), cT = $('cT');

  /* health */
  async function ping(){try{const r=await fetch(API+'/health');const d=await r.json();if(d.status==='ok'){cD.classList.remove('off');cT.textContent='Connected'}else throw 0}catch{cD.classList.add('off');cT.textContent='Offline'}}
  ping(); setInterval(ping,30000);

  /* toggle */
  function flipTgl(){clarOn=!clarOn;tgl.classList.toggle('on',clarOn);tgl.setAttribute('aria-checked',clarOn)}
  tgl.onclick=flipTgl;
  tgl.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flipTgl()}};

  /* examples */
  $('exs').onclick=e=>{const b=e.target.closest('.ex');if(!b)return;qIn.value=b.textContent;go()};

  /* submit */
  qIn.onkeydown=e=>{if(e.key==='Enter'&&!busy)go()};
  qSend.onclick=()=>{if(!busy)go()};

  async function go(){
    const q=qIn.value.trim();if(!q)return;
    qIn.value='';lock(true);show(false);addQ(q);
    const tid=addThink();
    try{
      const r=await fetch(API+'/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,clarification_enabled:clarOn})});
      const d=await r.json();rmThink(tid);
      if(!r.ok){addErr(d.detail||'Request failed.')}else{handle(d,q)}
    }catch{rmThink(tid);addErr('Could not reach the server.')}
    lock(false);
  }

  /* resolve */
  async function resolve(ans){
    if(!pending||!ans.trim())return;lock(true);addQ(ans);
    const tid=addThink();
    try{
      const r=await fetch(API+'/query/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({original_question:pending,clarification_answer:ans})});
      const d=await r.json();rmThink(tid);
      if(!r.ok){addErr(d.detail||'Request failed.')}else{pending=null;handle(d,null)}
    }catch{rmThink(tid);addErr('Could not reach the server.')}
    lock(false);
  }

  function handle(d,oq){
    if(d.action==='clarify'){pending=d.original_question||oq;addClar(d.clarifying_question||d.ambiguity_reason||'Could you clarify?')}
    else if(d.action==='sql'){addRes(d)}
    else if(d.action==='error'){addErr(d.error||'Something went wrong.')}
  }

  /* DOM */
  function show(s){land.style.display=s?'':'none';conv.classList.toggle('on',!s)}

  function addQ(t){const e=mk('blk');e.innerHTML='<div class="q-text">'+esc(t)+'</div>';conv.appendChild(e);scroll()}

  function addThink(){const id='t'+Date.now();const e=mk('blk');e.id=id;e.innerHTML='<div class="think"><div class="dots"><span></span><span></span><span></span></div>Thinking</div>';conv.appendChild(e);scroll();return id}
  function rmThink(id){const e=$(id);if(e)e.remove()}

  function addClar(q){
    const cid='c'+Date.now();
    const e=mk('blk');
    e.innerHTML='<div class="clar"><div class="clar-pre">One detail first</div><div class="clar-q">'+esc(q)+'</div><div class="clar-row"><input class="clar-in" id="'+cid+'" type="text" placeholder="Your answerâ€¦" autocomplete="off"><button class="clar-btn" id="'+cid+'b">Continue</button></div></div>';
    conv.appendChild(e);scroll();
    setTimeout(()=>{const i=$(cid);if(i){i.focus();i.onkeydown=ev=>{if(ev.key==='Enter')doClar(cid)};$(cid+'b').onclick=()=>doClar(cid)}},60);
  }
  function doClar(cid){const i=$(cid);if(!i)return;const v=i.value.trim();if(!v)return;i.disabled=true;$(cid+'b').disabled=true;resolve(v)}

  function addRes(d){
    const e=mk('blk');let h='';
    if(d.assumption_made)h+='<div class="assume"><strong>Assumption</strong> '+esc(d.assumption_made)+'</div>';
    if(d.results&&d.results.length){
      const cols=Object.keys(d.results[0]);
      h+='<div class="res-lbl">Results</div><div class="t-wrap"><table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+d.results.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(String(r[c]??''))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
    }else{h+='<div class="res-lbl">Results</div><p style="color:var(--text-3);font-size:14px">No rows returned.</p>'}
    if(d.sql){
      const sid='s'+Date.now();
      h+='<div class="sql-sec"><button class="sql-tog" data-sid="'+sid+'"><span class="sql-arr" id="'+sid+'a">&#9654;</span> View generated SQL</button><div class="sql-body" id="'+sid+'"><pre class="sql-pre">'+esc(d.sql)+'</pre><button class="sql-cp" data-sid="'+sid+'">Copy</button></div></div>';
    }
    e.innerHTML=h;conv.appendChild(e);scroll();
  }

  function addErr(m){const e=mk('blk');e.innerHTML='<div class="err"><strong>Something went wrong.</strong>'+esc(m)+'</div>';conv.appendChild(e);scroll()}

  /* sql toggle + copy (delegated) */
  document.addEventListener('click',ev=>{
    const togBtn=ev.target.closest('.sql-tog');
    if(togBtn){const sid=togBtn.dataset.sid;const b=$(sid);const a=$(sid+'a');if(b){b.classList.toggle('on');a.classList.toggle('open')}return}
    const cpBtn=ev.target.closest('.sql-cp');
    if(cpBtn){const sid=cpBtn.dataset.sid;const b=$(sid);if(!b)return;const txt=b.querySelector('.sql-pre').textContent;navigator.clipboard.writeText(txt).then(()=>{cpBtn.textContent='Copied';cpBtn.classList.add('ok');setTimeout(()=>{cpBtn.textContent='Copy';cpBtn.classList.remove('ok')},1400)})}
  });

  /* util */
  function mk(cls){const d=document.createElement('div');d.className=cls;return d}
  function lock(b){busy=b;qSend.disabled=b;qIn.disabled=b}
  function scroll(){setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),40)}
  function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
})();
</script>
</body>
</html>
